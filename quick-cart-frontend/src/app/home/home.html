<h1>
  Welcome
</h1>
<section class="hero">

  <div class="hero-content">

    <div class="badge">
      ⏳ Your time. Your bottle.
    </div>

    <h1>
      Stop wasting time.
      <span>Start collecting it.</span>
    </h1>

    <p>
      Time in a Bottle turns your focused hours into something you can
      actually see, track and spend.
    </p>

    <div class="hero-actions">

      @if (isAuthenticated) {

        <button
          class="primary-button"
          (click)="goToProducts()">

          Explore Products →

        </button>

      } @else {

        <button
          class="primary-button"
          (click)="login()">

          Start Your Journey →

        </button>

      }

    </div>

  </div>


  <div class="hero-visual">

    <div class="bottle">
      ⏳
    </div>

  </div>

</section>
