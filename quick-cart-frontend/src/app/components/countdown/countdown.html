<div class="countdown" [class.warm]="urgency === 'warm'" [class.critical]="urgency === 'critical'">
  <span class="segment">
    <span class="value">{{ pad(hours) }}</span>
    <span class="label">h</span>
  </span>
  <span class="colon">:</span>
  <span class="segment">
    <span class="value">{{ pad(minutes) }}</span>
    <span class="label">m</span>
  </span>
  <span class="colon">:</span>
  <span class="segment">
    <span class="value">{{ pad(seconds) }}</span>
    <span class="label">s</span>
  </span>
  <span class="tag">left</span>
</div>
<div class="progress-track">
  <div class="progress-fill" [class.warm]="urgency === 'warm'" [class.critical]="urgency === 'critical'"
       [style.width.%]="progressPercent"></div>
</div>
